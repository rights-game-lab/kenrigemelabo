const GENRE_NAMES = {A:'身体・自由系',B:'表現・思想系',C:'プライバシー系',D:'教育・労働系',E:'平等・差別系'};

let activeGenre = 'all';
let query = '';

function esc(str) {
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hi(text, q) {
  if (!q) return esc(text);
  const escaped_q = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return esc(text).replace(new RegExp('(' + esc(escaped_q) + ')', 'gi'), '<mark>$1</mark>');
}

function render() {
  const q = query.toLowerCase();
  const content = document.getElementById('content');
  let html = '';
  let total = 0;

  for (const gk of ['A','B','C','D','E']) {
    if (activeGenre !== 'all' && activeGenre !== gk) continue;

    const items = RIGHTS.filter(r => {
      if (r.g !== gk) return false;
      if (!q) return true;
      return (r.n + r.r + r.d + r.c).toLowerCase().includes(q);
    });

    if (!items.length) continue;
    total += items.length;

    html += `<div class="genre-header genre-header-${gk}">
      <div class="genre-dot dot-${gk}"></div>
      <span class="genre-name-text gname-${gk}">${GENRE_NAMES[gk]}</span>
      <span class="genre-count-text gname-${gk}">${items.length}枚</span>
    </div>`;

    for (const r of items) {
      var caseInfo = CASES[r.c];
      var caseHtml = caseInfo
        ? '<div class="card-link"><a href="' + caseInfo.url + '" target="_blank" rel="noopener">📖 ' + caseInfo.title + ' →</a></div>'
        : '';
      html += '<div class="card-item">'
        + '<div class="card-top">'
        + '<span class="card-code code-' + r.g + '">' + r.c + '</span>'
        + '<span class="card-name">' + hi(r.n, q) + '</span>'
        + '</div>'
        + '<div class="card-meta">'
        + '<span class="card-ref">' + hi(r.r, q) + '</span>'
        + '<span class="card-stars stars-' + r.g + '">' + r.s + '</span>'
        + '</div>'
        + '<div class="card-desc">' + hi(r.d, q) + '</div>'
        + caseHtml
        + '</div>';
    }
  }

  content.innerHTML =
    `<div class="count-bar">${total}件</div>` +
    (html || '<div class="empty-msg">該当する権利が見つかりませんでした</div>');
}

document.getElementById('searchInput').addEventListener('input', function() {
  query = this.value.trim();
  render();
});

document.getElementById('filters').addEventListener('click', function(e) {
  var btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(function(b) {
    b.classList.remove('active');
  });
  btn.classList.add('active');
  activeGenre = btn.getAttribute('data-genre');
  render();
});

render();
</script>
